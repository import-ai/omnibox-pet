name: Build OmniBox Pet

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: xiaohei-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Import macOS signing certificate
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" ]]; then
            echo "::warning::CSC_LINK is unavailable. The build can use ad-hoc signing."
            exit 0
          fi

          keychain="$RUNNER_TEMP/xiaohei-sign.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/xiaohei-signing.p12"
          umask 077
          trap 'unlink "$certificate"' EXIT
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application:/ && !found { print $2; found = 1 }')"
          : "${identity:?The certificate must contain a valid Developer ID Application identity}"
          security list-keychains -d user -s "$keychain"
          echo "XIAOHEI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and verify Universal app
        env:
          XIAOHEI_REQUIRE_STABLE_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Release tag must match the app version: v$version"
              exit 1
            fi
          fi
          ./build.sh
          lipo XiaoheiPet.app/Contents/MacOS/XiaoheiPet -verify_arch arm64 x86_64
          codesign --verify --deep --strict XiaoheiPet.app
          ditto -c -k --sequesterRsrc --keepParent XiaoheiPet.app XiaoheiPet-macOS-universal.zip

      - name: Render Xiaohei state sheet
        run: ./XiaoheiPet.app/Contents/MacOS/XiaoheiPet --render-xiaohei-preview xiaohei-states.png

      - name: Upload Universal app and state sheet
        uses: actions/upload-artifact@v4
        with:
          name: XiaoheiPet-macOS-universal
          if-no-files-found: error
          path: |
            XiaoheiPet-macOS-universal.zip
            xiaohei-states.png

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Windows x64 app
        run: |
          cmake -S windows -B windows/build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build windows/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath windows/build/Release/XiaoheiPet.exe -DestinationPath XiaoheiPet-Windows-x64.zip

      - name: Smoke test Windows app
        run: |
          $app = Start-Process -FilePath windows/build/Release/XiaoheiPet.exe -ArgumentList '--no-update-check' -PassThru
          try {
            if ($app.WaitForExit(3000)) {
              throw "XiaoheiPet exited during startup (exit code $($app.ExitCode))"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }

      - name: Upload Windows x64 app
        uses: actions/upload-artifact@v4
        with:
          name: XiaoheiPet-Windows-x64
          if-no-files-found: error
          path: XiaoheiPet-Windows-x64.zip

  release:
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: XiaoheiPet-macOS-universal
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: XiaoheiPet-Windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/XiaoheiPet-macOS-universal.zip
            dist/XiaoheiPet-Windows-x64.zip
          fail_on_unmatched_files: true
