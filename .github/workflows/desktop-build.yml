name: Build OmniBox Pet

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: xiaohei-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && '1' || '' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.names.outputs.macos }}
      windows: ${{ steps.names.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Name build artifacts
        id: names
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a three-part version in Resources/Info.plist"
            exit 1
          fi
          name="omnibox-pet-v${version}"
          if [[ -n "$RELEASE_BUILD" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Release tag must match the app version: v$version"
              exit 1
            fi
          else
            channel=manual
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              channel="pr-$PR_NUMBER"
            elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
              channel=main
            fi
            name="$name-$channel-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          fi
          echo "macos=$name-macos-universal" >> "$GITHUB_OUTPUT"
          echo "windows=$name-windows-x64" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Import macOS signing certificate
        if: env.RELEASE_BUILD == '1'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing CSC_LINK}"

          keychain="$RUNNER_TEMP/xiaohei-sign.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/xiaohei-signing.p12"
          umask 077
          trap 'unlink "$certificate"' EXIT
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application:/ && !found { print $2; found = 1 }')"
          : "${identity:?The certificate must contain a valid Developer ID Application identity}"
          security list-keychains -d user -s "$keychain"
          echo "XIAOHEI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and verify Universal app
        env:
          XIAOHEI_REQUIRE_STABLE_SIGNATURE: ${{ env.RELEASE_BUILD }}
        run: |
          if [[ -z "$XIAOHEI_REQUIRE_STABLE_SIGNATURE" ]]; then
            export XIAOHEI_SIGN_IDENTITY=-
          fi
          ./build.sh
          lipo "桌宠小黑.app/Contents/MacOS/桌宠小黑" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "桌宠小黑.app"

      - name: Package macOS disk image
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.macos }}.dmg
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          ditto "桌宠小黑.app" "$staging/桌宠小黑.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "桌宠小黑" -srcfolder "$staging" -fs HFS+ -format UDZO "$IMAGE_NAME"

      - name: Notarize and staple the release disk image
        if: env.RELEASE_BUILD == '1'
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.macos }}.dmg
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          umask 077
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'unlink "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"

          codesign --sign "$XIAOHEI_SIGN_IDENTITY" --timestamp --identifier pro.omnibox.xiaohei-pet.dmg "$IMAGE_NAME"
          result=$(xcrun notarytool submit "$IMAGE_NAME" --key "$key" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 25m --output-format json)
          printf '%s\n' "$result"
          if ! jq -e '.status == "Accepted"' <<< "$result" >/dev/null; then
            id=$(jq -r '.id' <<< "$result")
            xcrun notarytool log "$id" --key "$key" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
            exit 1
          fi
          xcrun stapler staple "$IMAGE_NAME"
          xcrun stapler validate "$IMAGE_NAME"
          codesign --verify "$IMAGE_NAME"

      - name: Render Xiaohei state sheet
        run: './桌宠小黑.app/Contents/MacOS/桌宠小黑 --render-xiaohei-preview xiaohei-states.png'

      - name: Upload macOS packages and state sheet
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.macos }}
          if-no-files-found: error
          path: |
            ${{ needs.prepare.outputs.macos }}.dmg
            xiaohei-states.png

  build-windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Windows x64 app
        env:
          ARCHIVE_NAME: ${{ needs.prepare.outputs.windows }}.zip
        run: |
          cmake -S windows -B windows/build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build windows/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath windows/build/Release/XiaoheiPet.exe -DestinationPath $env:ARCHIVE_NAME

      - name: Smoke test Windows app
        run: |
          $app = Start-Process -FilePath windows/build/Release/XiaoheiPet.exe -ArgumentList '--no-update-check' -PassThru
          try {
            if ($app.WaitForExit(3000)) {
              throw "XiaoheiPet exited during startup (exit code $($app.ExitCode))"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }

      - name: Upload Windows x64 app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.windows }}
          if-no-files-found: error
          path: ${{ needs.prepare.outputs.windows }}.zip

  release:
    needs: [prepare, build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.macos }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.windows }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/${{ needs.prepare.outputs.macos }}.dmg
            dist/${{ needs.prepare.outputs.windows }}.zip
          fail_on_unmatched_files: true
