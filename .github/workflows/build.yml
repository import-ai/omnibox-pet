name: Build Xiaohei Pet (macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # macOS remembers Input Monitoring permission by code signature. Signing every release with the
      # same certificate (created once by scripts/create-macos-signing-cert.sh) keeps the permission
      # across updates; ad-hoc builds force users to re-grant it after every update.
      - name: Import stable signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_SIGN_P12_BASE64 secret is not set: this macOS build is ad-hoc signed and users must re-enable Input Monitoring after updating."
            exit 0
          fi
          KC="$RUNNER_TEMP/xiaohei-sign.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/xiaohei-signing.p12"
          security import "$RUNNER_TEMP/xiaohei-signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/xiaohei-signing.p12"
          echo "XIAOHEI_SIGN_IDENTITY=KuroCat Code Signing" >> "$GITHUB_ENV"

      - name: Build Universal XiaoheiPet.app (Apple Silicon + Intel)
        run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent XiaoheiPet.app XiaoheiPet-macOS-universal.zip
          ls -lh XiaoheiPet-macOS-universal.zip

      - name: Render Xiaohei state sheet
        run: ./XiaoheiPet.app/Contents/MacOS/XiaoheiPet --render-xiaohei-preview xiaohei-states.png

      - name: Upload macOS universal app artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoheiPet-macOS-universal
          path: |
            XiaoheiPet-macOS-universal.zip
            xiaohei-states.png

  release:
    needs: [ build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: XiaoheiPet-macOS-universal
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/XiaoheiPet-macOS-universal.zip
